# The claim judge, judge v6 (docs/plans/judge-v6.md, approved 2026-10-30): judge v5's claim table,
# score per claim and skeptic pass, with a gap type per claim (gap_types), the cited service's own
# name cleared in code, the grid read as levels, and a names count. A candidate: it grades under
# its own name, judge-v6, beside the validated judge (v2), and no gate or alert reads it until
# stage C passes. Its thresholds and gap_types are placeholders until stage A freezes a version:
# the first draft is code only (gap_types: false, v5's prompts); revision 1 adds the gap types.
# The round stopped at stage A on 2026-10-31 with no version frozen, so they were never set, and no
# online run uses this judge.
# Judging a run with it costs money and is the v6 round's spend: evals judge RUN -c configs/judge-v6.yaml

paths:
  corpus_dir: data/snapshots/aws-docs
  docs_lock: configs/docs_pages.lock.json   # page hashes, committed; see evals snapshot --check
  suites_dir: suites
  cache_dir: .cache/llm
  db: results/evals.duckdb

run:
  workers: 4         # parallel cases; lower this if you hit rate limits
  budget_usd: 5.0    # stop a run once uncached spend passes this (needs pricing below)

docs_agent:
  model:
    name: claude-haiku-5-5
    max_tokens: 2048
    temperature: null      # null = API default
    pricing:
      # USD per million tokens for claude-haiku-5-5, Anthropic first-party rates as of 2026-10-06,
      # for prompts up to 100K tokens (every request here is far below that). Re-check at
      # https://platform.claude.com/docs/en/about-claude/pricing when the model changes.
      input_per_mtok: 0.10
      output_per_mtok: 0.50
  max_steps: 12
  search_k: 5
  page_chars: 8000
  strict_tools: true       # set false if the API rejects strict tool schemas for this model
  max_submission_rejections: 3   # then the attempt fails as malformed_submission
  prompt_version: v3             # champion since iteration 1 (2026-10-16); v2 is the previous champion

graders:
  min_quote_chars: 12      # shorter quotes can't be verified against a page; count as fabricated

judge:
  # The claim judge (graders/claim_judge.py). Only `evals judge RUN` calls it; a normal run never
  # does. It judges support only, with no responsive call. Pricing is not part of its version.
  model:
    name: claude-sonnet-5-5   # named on purpose: a model block without a name means haiku
    max_tokens: 8192          # the claim table is far longer than a verdict, and it thinks first
    temperature: null         # the installed SDK (anthropic 1.x) rejects temperature; leave null
    pricing:
      # USD per million tokens for claude-sonnet-5-5, first-party, from
      # https://platform.claude.com/docs/en/about-claude/pricing on 2026-10-19. Prompt-cache
      # reads on Sonnet 5.5 cost 0.05x the input price, not the default 0.1x.
      input_per_mtok: 2.00
      output_per_mtok: 10.00
      cache_read_multiplier: 0.05
  strict_tools: true
  method: claims
  grader_name: judge-v6
  rubric_version: v5        # rubric v5's text unchanged (decision 9)
  gap_types: false          # the first draft; stage A's revision 1 judges with true
  support_threshold: 69     # t, a placeholder: stage A picks it from 64, 69 and 74 (the levels 65, 70, 75)
  skeptic_threshold: null   # s, a placeholder: stage A picks it from off (null), 49 and 59
  responsive: false         # the claim judge makes no responsive call

suites:
  # Kept out of the snapshot on purpose so unanswerable cases have real material; `evals
  # validate` fails if a page about one of these is ever added. Matched case-insensitively
  # against page titles and URLs, and against unanswerable questions.
  held_out_services:
    - GameLift
    - Ground Station
    - Braket
    - RoboMaker
    - Snowball
    - Snow Family
    - Chime
    - Greengrass
    - WorkSpaces
    - MediaConvert
    - Managed Blockchain
    - Outposts
