[project]
name = "agent-evals"
version = "0.1.0"
description = "Evaluate tool-using LLM agents for accuracy and hallucination, and improve them through eval-gated learning loops."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Aleena Benny" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "markdownify>=0.13",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
evals = "agent_evals.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "markdownify", "bs4", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
