[project]
name = "agent-evals"
version = "0.1.0"
description = "Evaluate tool-using LLM agents for accuracy and hallucination, and improve them through eval-gated learning loops."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Aleena Benny" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "botocore>=1.43.123",
    "duckdb>=1.1",
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "markdownify>=0.13",
    "numpy>=1.26",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
evals = "agent_evals.cli:app"

[dependency-groups]
# What the code agent's sandbox image holds besides the standard library, pinned through uv.lock
# into deploy/sandbox-requirements.txt (docs/plans/phase-3-code-agent.md, part 3).
sandbox = [
    "boto3>=1.43.123",
    "moto[dynamodb,ec2,iam,kms,s3,secretsmanager,sns,sqs,ssm]>=5.2.5",
]
dev = [
    {include-group = "sandbox"},
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "markdownify", "bs4", "bs4.*", "boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sandbox: needs Docker and the code agent's sandbox image (`uv run evals sandbox-build`); skipped without them",
]
