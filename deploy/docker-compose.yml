# The whole stack on one machine. Every port is bound to localhost: the service has no
# authentication, and nothing here is meant to be reachable from another machine.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Fake provider, which costs nothing:
#   SERVICE_CONFIG=configs/service-fake.yaml docker compose -f deploy/docker-compose.yml up --build
#
# Service http://127.0.0.1:8000  Grafana http://127.0.0.1:3000  Prometheus http://127.0.0.1:9090
# Jaeger http://127.0.0.1:16686

services:
  service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - /bin/sh
      - -c
      - /app/.venv/bin/evals serve --host 0.0.0.0 -c "$${SERVICE_CONFIG}"
    environment:
      SERVICE_CONFIG: ${SERVICE_CONFIG:-configs/service.yaml}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    env_file:
      - path: ../.env
        required: false
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      # The folder, not the file: the registry is replaced on change, and a single-file mount
      # would keep showing the old one.
      - ../configs:/app/configs
      - ../data/snapshots:/app/data/snapshots:ro
      - ../results/service:/app/results/service
      - ../suites:/app/suites:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - 127.0.0.1:9090:9090

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3000:3000

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
