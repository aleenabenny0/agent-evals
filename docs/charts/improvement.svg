  <text x="24.0" y="752.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">(validated against a human, kappa 0.80 to 1.00) over answered cases with citations: holdout 133 and 132 of</text>
  <text x="24.0" y="768.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">150, dev 117 to 119 of 130. Dev dots average 3 attempts per case; the CHANGELOG pairs the cases two runs</text>
  <text x="24.0" y="784.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">share, so its figures differ slightly (v5: 0.612 paired, 0.606 here). Dev correct is after the 2026-10-17</text>
