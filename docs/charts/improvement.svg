  <text x="24.0" y="816.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Gate: fully supported must improve beyond its interval, and correct, abstentions, fabricated citations,</text>
  <text x="24.0" y="832.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">rejected submissions and every case type and area must not regress.</text>
  <text x="24.0" y="848.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">v4 and v5 write 27-28% shorter answers, past the 25% line fixed before the runs, so the judge needed a human</text>
  <text x="24.0" y="864.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">spot check. For v5 it failed (the judge passed 3 of 30 answers the human failed; the bar was 2), and two</text>
  <text x="24.0" y="880.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">repairs of the judge also missed their rules, so v5 was not shipped. v4 was never spot-checked.</text>
  <text x="24.0" y="896.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Human labels (diamonds), attempt 1: v2 114 and v3 80 answers, the first in case-id order; v5 90 answers, a</text>
  <text x="24.0" y="912.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">random sample. The samples differ, so the diamonds are not a paired comparison.</text>
